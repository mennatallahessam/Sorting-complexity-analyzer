<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorting Complexity Analyzer</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <header>
        <h1>Sorting Complexity Analyzer</h1>
    </header>

    <section class="input-section card">
        <h2>Dataset Input</h2>
        <textarea id="manualInput" placeholder="Enter numbers separated by commas or spaces"></textarea>
        <div class="button-row">
            <button id="loadFileBtn">Load from File</button>
            <input type="file" id="fileInput" accept=".txt" style="display:none" />
            <button id="generateBtn">Generate Random</button>
        </div>
        <div id="randomOptions" class="modal hidden">
            <label>Size: <input type="number" id="randSize" min="10" max="200" value="50" /></label>
            <label>Max Value: <input type="number" id="randMax" min="1" value="999" /></label>
            <button id="createRandomBtn">Create</button>
            <button id="closeRandomBtn">Close</button>
        </div>
    </section>

    <section class="algorithm-section card">
        <h2>Choose Algorithms</h2>
        <div class="alg-list" id="algList">
            <!-- Checkboxes will be generated by script -->
        </div>
        <button id="runSelectedBtn">Run Selected</button>
        <button id="runAllBtn">Run All</button>
    </section>

    <section class="visualization-section card">
        <h2>Visualization</h2>
        <canvas id="chartCanvas" height="300"></canvas>
        <div class="control-row">
            <button id="pauseBtn">Pause</button>
            <button id="resumeBtn" class="hidden">Resume</button>
            <label>Speed:
                <select id="speedSelect">
                    <option value="500">Normal</option>
                    <option value="250">Fast</option>
                    <option value="1000">Slow</option>
                </select>
            </label>
        </div>
    </section>

    <section class="summary-section card">
        <h2>Performance Summary</h2>
        <div id="summaryContainer"></div>
    </section>

    <section class="complexity-section card">
        <h2>Theoretical Complexities</h2>
        <table id="complexityTable">
            <thead>
                <tr><th>Algorithm</th><th>Best</th><th>Average</th><th>Worst</th><th>Space</th></tr>
            </thead>
            <tbody></tbody>
        </table>
        <div class="export-row">
            <button id="exportCsvBtn">Export Summary CSV</button>
            <button id="exportPngBtn">Export Visualization PNG</button>
        </div>
    </section>

    <script src="data.js" type="module"></script>
    <script src="algorithms.js" type="module"></script>
    <script src="metrics.js" type="module"></script>
    <script src="visualizer.js" type="module"></script>
    <script src="script.js" type="module"></script>
</body>
</html>
